name: "release"

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm run test

  publish-tauri:
    needs: test-and-lint
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm' # This caches node_modules and npm cache automatically

      - name: install frontend dependencies
        run: npm ci # Faster and more reliable than 'install' in CI

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Better keying for cache
          key: ${{ matrix.platform }}-cargo

      - name: get changelog content
        id: changelog
        shell: bash
        run: |
          # Extract only the latest version from CHANGELOG.md using awk
          # This captures everything from the first '## [' to the next one (exclusive)
          CONTENT=$(awk '/^## \[/{if (count++) exit} {if (count) print}' res/docs/CHANGELOG.md)
          
          # If awk fails or CONTENT is empty, fallback to reading the first section
          if [ -z "$CONTENT" ]; then
            CONTENT=$(cat res/docs/CHANGELOG.md | sed -n '/^## \[/,$p')
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate release token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "Missing required secret: RELEASE_TOKEN"
            exit 1
          fi

      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Missing WINDOWS_CERTIFICATE or WINDOWS_CERTIFICATE_PASSWORD secret.'
          }

          $certificateDir = Join-Path $env:RUNNER_TEMP 'league-profile-tool-signing'
          New-Item -ItemType Directory -Force -Path $certificateDir | Out-Null
          $certificatePath = Join-Path $certificateDir 'certificate.pfx'
          $base64 = $env:WINDOWS_CERTIFICATE.Trim()
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($base64))

          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword `
            -Exportable

          if ($null -eq $certificate) {
            throw 'The Windows code-signing certificate could not be imported.'
          }

          Write-Host "Certificate imported: $($certificate.Thumbprint)"

          $tauriConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          }
          $tauriConfig | ConvertTo-Json -Depth 5 | Set-Content -Path 'src-tauri/tauri.windows.conf.json'

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Tauri v2 reads these names; the legacy pair above is kept because
          # tauri-action itself still consumes it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "League Profile Tool v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Remove Windows signing material
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/league-profile-tool-signing"
          Remove-Item -Force -ErrorAction SilentlyContinue 'src-tauri/tauri.windows.conf.json'

  update-updater-json:
    needs: publish-tauri
    runs-on: ubuntu-latest
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download the updater manifest produced by the release
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          # latest.json is written by tauri-action from the real bundle artifacts,
          # so signatures and URLs cannot drift from what was actually uploaded.
          curl -fL -H "Authorization: Bearer $GITHUB_TOKEN" -o updater.json \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/latest.json"
          cat updater.json

      - name: Attach changelog notes to the manifest
        run: |
          set -euo pipefail
          NOTES=$(awk '/^## \[/{if (count++) exit} {if (count) print}' res/docs/CHANGELOG.md)
          jq --arg notes "$NOTES" '.notes = $notes' updater.json > updater.tmp.json
          mv updater.tmp.json updater.json
          jq -e '.version and (.platforms | length > 0)' updater.json > /dev/null \
            || { echo '::error::updater manifest is missing version or platforms'; exit 1; }
          jq -e '[.platforms[].signature] | all(. != null and . != "" and . != "Not Found")' updater.json > /dev/null \
            || { echo '::error::updater manifest contains a missing signature'; exit 1; }
          cat updater.json

      - name: Commit and push updated updater.json
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater.json
          git commit -m "chore: update updater.json with signatures for v${{ steps.version.outputs.version }}" || exit 0
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main

  notify-discord:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: get changelog content
        id: changelog
        shell: bash
        run: |
          # Extract only the latest version from CHANGELOG.md
          CONTENT=$(awk '/^## \[/{if (count++) exit} {if (count) print}' res/docs/CHANGELOG.md)
          
          if [ -z "$CONTENT" ]; then
            CONTENT=$(cat res/docs/CHANGELOG.md | sed -n '/^## \[/,$p')
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "🚀 New Version Released: ${{ steps.version.outputs.tag }}"
          embed-description: "${{ steps.changelog.outputs.body }}"
          embed-url: "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          embed-color: "16766720"
          embed-author-name: "League Profile Tool"
          embed-author-url: "https://github.com/${{ github.repository }}"
          embed-footer-text: "Download now to get the latest features! ✨"
